name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest.json
        run: |
          python3 -c "import json;m=json.load(open('extension/manifest.json'));assert m['manifest_version']==3;print('manifest v'+m['version'])"
      - name: Ensure no remote code in extension
        run: |
          if grep -rnE 'https?://(?!inazuma)' extension --include='*.js' | grep -vE '^\s*//' ; then
            echo "note: review external URLs above"
          fi
      - name: Package extension
        run: cd extension && zip -qr ../inazuma-wallet.zip . && ls -lh ../inazuma-wallet.zip
      - uses: actions/upload-artifact@v6
        with:
          name: inazuma-wallet-extension
          path: inazuma-wallet.zip
