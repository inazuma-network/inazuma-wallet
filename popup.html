<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inazuma Wallet</title>
    <link rel="stylesheet" href="fonts.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --card: #0f0f0f;
        --card2: #141414;
        --line: #232323;
        --text: #ededf0;
        --muted: #9a9aa3;
        --signal: #f02fc3;
        --bad: #f0374f;
        --good: #f02fc3;
        --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
        --tight: "Inter Tight", Inter, ui-sans-serif, system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        width: 400px;
        height: 600px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background:
          radial-gradient(620px 300px at 82% -12%, rgba(240,47,195,.13), transparent 72%),
          var(--bg);
        color: var(--text);
        font-family: var(--tight);
        font-size: 14px;
      }
      header {
        flex: 0 0 auto;
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        padding: 12px 16px; border-bottom: 1px solid var(--line);
        background: rgba(10,10,10,.72); backdrop-filter: blur(8px);
      }
      .brandwrap { display: flex; align-items: center; gap: 9px; min-width: 0; }
      .brandwrap img { width: 22px; height: 22px; border-radius: 6px; }
      .brand { font-family: var(--tight); font-weight: 700; letter-spacing: .22em; font-size: 12px; text-transform: uppercase; }
      .chip {
        font-family: var(--mono); font-size: 10px; color: var(--signal);
        border: 1px solid rgba(240,47,195,.35); border-radius: 999px; padding: 3px 9px;
        white-space: nowrap;
      }
      .chip.net::before {
        content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 999px;
        background: var(--good); margin-right: 6px; vertical-align: middle;
      }
      .iconbtn {
        display: grid; place-items: center; width: 30px; height: 30px; flex: 0 0 auto;
        border-radius: 9px; border: 1px solid var(--line); background: var(--card);
        color: var(--muted); cursor: pointer; padding: 0;
      }
      .iconbtn:hover { color: var(--text); border-color: var(--signal); }
      main { flex: 1 1 auto; overflow-y: auto; padding: 14px 16px 18px; }
      main::-webkit-scrollbar { width: 6px; }
      main::-webkit-scrollbar-thumb { background: #23232e; border-radius: 999px; }
      nav {
        flex: 0 0 auto; display: none; border-top: 1px solid var(--line);
        background: rgba(10,10,10,.88);
      }
      nav.on { display: grid; grid-template-columns: repeat(3, 1fr); }
      nav button {
        background: transparent; border: 0; padding: 11px 0 13px; cursor: pointer;
        color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .1em;
        text-transform: uppercase; border-top: 2px solid transparent; margin: 0;
        width: auto; border-radius: 0;
      }
      nav button.active { color: var(--signal); border-top-color: var(--signal); }
      h2 { font-family: var(--serif); font-weight: 400; font-size: 21px; margin: 0 0 8px; letter-spacing: -.01em; text-transform: none; }
      p { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin: 0 0 10px; }
      label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin: 0 0 5px; }
      input, textarea {
        width: 100%; margin-bottom: 10px; padding: 11px 12px; border-radius: 11px;
        border: 1px solid var(--line); background: #070707; color: var(--text);
        font-family: var(--mono); font-size: 12.5px; outline: none; resize: none;
      }
      input:focus, textarea:focus { border-color: var(--signal); }
      button {
        width: 100%; padding: 11px 12px; margin-bottom: 8px; border: 0; border-radius: 999px;
        background: var(--signal); color: #0a0a0a; font-weight: 700; font-size: 13px; cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
      button.ghost:hover { border-color: var(--signal); filter: none; }
      button.danger { background: transparent; border: 1px solid rgba(255,92,108,.4); color: var(--bad); }
      button:disabled { opacity: .5; cursor: default; }
      .row { display: flex; gap: 8px; }
      .card { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
      .hero { background: linear-gradient(160deg, rgba(240,47,195,.13), rgba(15,15,15,.92) 55%); }
      .balance { font-family: var(--tight); font-size: 34px; font-weight: 600; letter-spacing: -.03em; margin: 4px 0 2px; }
      .balance span { color: var(--signal); font-size: 14px; font-weight: 700; margin-left: 4px; }
      .sub { font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
      .addrrow {
        display: flex; align-items: center; gap: 8px; margin-top: 12px;
        border: 1px solid var(--line); background: rgba(0,0,0,.35); border-radius: 999px; padding: 7px 8px 7px 12px;
      }
      .addrrow .mono { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mono { font-family: var(--mono); font-size: 12px; word-break: break-all; }
      .muted { color: var(--muted); }
      .sig { color: var(--signal); }
      .msg { font-family: var(--mono); font-size: 11.5px; margin-top: 8px; word-break: break-all; min-height: 14px; }
      .msg.err { color: var(--bad); }
      .msg.ok { color: var(--good); }
      ul { list-style: none; padding: 0; margin: 0; }
      li.tx {
        display: flex; align-items: center; gap: 10px; padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      li.tx:last-child { border-bottom: 0; }
      .dot { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; flex: 0 0 auto;
             border: 1px solid var(--line); font-size: 13px; }
      .dot.out { color: var(--bad); } .dot.in { color: var(--good); }
      .serif { font-family: var(--serif); font-weight: 400; }
      .txmeta { flex: 1; min-width: 0; }
      .txmeta b { display: block; font-size: 12.5px; font-weight: 600; }
      .txamt { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
      .reveal { position: relative; }
      .reveal .secret {
        font-family: var(--mono); font-size: 12.5px; line-height: 1.7; color: var(--text);
        border: 1px solid var(--line); background: #070707; border-radius: 12px; padding: 12px;
        word-break: break-word; filter: blur(7px); user-select: none; transition: filter .18s ease;
      }
      .reveal.shown .secret { filter: none; user-select: text; }
      .reveal .eye {
        position: absolute; inset: 0; display: grid; place-items: center; gap: 6px;
        cursor: pointer; color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
      }
      .reveal.shown .eye { position: static; inset: auto; margin-top: 8px; }
      .words { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .words span {
        font-family: var(--mono); font-size: 11.5px; color: var(--text);
        border: 1px solid var(--line); border-radius: 8px; padding: 6px 7px;
      }
      .words span i { color: var(--muted); font-style: normal; margin-right: 5px; font-size: 10px; }
      .kv { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
      .kv:last-child { border-bottom: 0; }
      .kv span:last-child { font-family: var(--mono); }
      .warn { border-color: rgba(255,92,108,.35); background: rgba(255,92,108,.06); }
      .warn p { color: #ff9fb0; }
      .center { text-align: center; }
      .logo-lg { width: 46px; height: 46px; border-radius: 13px; margin: 6px auto 10px; display: block; }
      .balrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
      .tile {
        width: auto; margin: 0; padding: 10px 0 9px; border-radius: 14px;
        background: rgba(0,0,0,.35); border: 1px solid var(--line); color: var(--text);
        font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
        display: grid; gap: 4px; justify-items: center;
      }
      .tile span { font-size: 15px; color: var(--signal); line-height: 1; }
      .tile:hover { border-color: var(--signal); filter: none; }
      .qr { width: 190px; height: 190px; border-radius: 14px; margin: 6px auto 12px; display: block; border: 1px solid var(--line); }
      li.acct {
        display: flex; align-items: center; gap: 10px; padding: 10px; cursor: pointer;
        border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px;
      }
      li.acct:hover { border-color: var(--signal); }
      li.acct.on { border-color: var(--signal); background: rgba(240,47,195,.07); }
      li.acct .av {
        width: 28px; height: 28px; border-radius: 999px; flex: 0 0 auto; display: grid; place-items: center;
        background: rgba(240,47,195,.16); color: var(--signal); font-weight: 800; font-size: 12px;
      }
      #hdracct {
        display: none; align-items: center; gap: 6px; width: auto; margin: 0; padding: 5px 10px;
        border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text);
        font-size: 11px; font-weight: 600;
      }
      #hdracct span { font-family: var(--mono); color: var(--muted); font-size: 10px; }
      #hdracct:hover { border-color: var(--signal); filter: none; }
      .title { font-family: var(--serif); font-size: 26px; font-weight: 400; letter-spacing: -.015em; margin: 0 0 6px; }
      .eyebrow { font-family: var(--mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .22em; color: var(--signal); margin: 0 0 8px; }
    </style>
  </head>
  <body>
    <header>
      <span class="brandwrap"><img src="icon32.png" alt="Inazuma" /><span class="brand">Inazuma</span></span>
      <button id="hdracct" title="Switch account"></button>
      <span style="display:flex;align-items:center;gap:8px">
        <span class="chip net" id="chip">Mainnet</span>
        <button class="iconbtn" id="hdrlock" title="Lock wallet" style="display:none;width:auto;padding:0 10px;font-size:10px;letter-spacing:.1em;text-transform:uppercase">Lock</button>
      </span>
    </header>
    <main id="root"></main>
    <nav id="tabs">
      <button data-tab="wallet">Wallet</button>
      <button data-tab="activity">Activity</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <script src="popup.js"></script>
  </body>
</html>
